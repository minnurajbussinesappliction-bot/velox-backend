<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Velox Ride</title>

  <!-- Leaflet CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Socket.io CDN -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100vh; background: #000000; color: #ffffff; display: flex; justify-content: center; }

    .app-screen {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #090c10;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      border: 1px solid #161b22;
    }

    /* Top Floating Navigation Header */
    .top-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .back-btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .icon-circle-btn {
      width: 38px;
      height: 38px;
      background: rgba(18, 23, 31, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Route Address Card */
    .address-card {
      background: rgba(18, 23, 31, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .route-dots {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .dot-green { width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid #22c55e; background: transparent; }
    .dot-line { width: 1.5px; height: 18px; border-left: 1.5px dashed #475569; }
    .dot-red { width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid #ef4444; background: transparent; }
    .inputs-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .loc-field {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
    }
    .loc-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: -4px;
    }

    /* Map Viewport */
    #map {
      width: 100%;
      height: 52vh;
      min-height: 320px;
      background: #0b0f17;
      z-index: 1;
    }

    /* Bottom Modal / Sheet */
    .sheet-card {
      flex: 1;
      background: #0e131b;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      margin-top: -24px;
      z-index: 500;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 18px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 -12px 30px rgba(0,0,0,0.7);
    }

    /* Screen 1: Ride Orb Layout */
    .orb-carousel {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
    }
    .orb-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      opacity: 0.5;
      transform: scale(0.88);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .orb-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #161e2b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .orb-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-top: 6px;
      text-transform: uppercase;
    }
    
    /* Highlighted Center Orb with Yellow Glow */
    .orb-item.active {
      opacity: 1;
      transform: scale(1.08);
    }
    .orb-item.active .orb-circle {
      width: 86px;
      height: 86px;
      background: radial-gradient(circle, #252312 20%, #151a24 90%);
      border: 2px solid #facc15;
      box-shadow: 0 0 28px rgba(250, 204, 21, 0.45);
    }
    .orb-item.active .orb-label {
      color: #ffffff;
    }
    .orb-eta {
      font-size: 12px;
      color: #facc15;
      font-weight: 700;
      margin-top: 10px;
    }

    /* Total Fare Display */
    .fare-price {
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 8px;
      letter-spacing: -0.5px;
    }
    .fare-subtitle {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      margin-bottom: 14px;
    }

    /* Screen 2: Trip Preview Grid */
    .metrics-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: #141c28;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 0;
      margin-bottom: 14px;
      text-align: center;
    }
    .metric-val { font-size: 16px; font-weight: 800; color: #fff; }
    .metric-lbl { font-size: 11px; color: #64748b; margin-top: 2px; }

    .selected-ride-row {
      width: 100%;
      background: #141c28;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .sel-left { display: flex; align-items: center; gap: 12px; }
    .sel-icon { font-size: 28px; }
    .sel-title { font-size: 15px; font-weight: 700; color: #fff; }
    .sel-sub { font-size: 11px; color: #64748b; }
    .sel-seats { background: #1c2636; padding: 4px 8px; border-radius: 8px; font-size: 12px; color: #94a3b8; font-weight: 700; }

    /* Yellow and Green CTA Buttons */
    .cta-btn-yellow {
      width: 100%;
      background: #facc15;
      color: #000000;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(250, 204, 21, 0.3);
    }
    .cta-btn-green {
      width: 100%;
      background: #4ade80;
      color: #04220e;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(74, 222, 128, 0.3);
    }

    /* Bottom 4 Utility Action Tiles */
    .action-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .action-tile {
      background: #141c28;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .action-tile span { font-size: 16px; }
    .action-tile div { font-size: 10px; color: #94a3b8; font-weight: 600; }

    /* Active Trip / OTP Card */
    .status-overlay {
      width: 100%;
      background: #141c28;
      border-radius: 14px;
      border: 1px solid #22c55e;
      padding: 14px;
      text-align: center;
      display: none;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <!-- Top Header Overlay -->
    <div class="top-header">
      <div class="back-btn-row">
        <div class="icon-circle-btn" onclick="toggleScreen()">←</div>
        <div class="header-title" id="pageTitle" style="display:none;">Trip Preview</div>
        <div class="icon-circle-btn">⋯</div>
      </div>

      <!-- Address Input Box -->
      <div class="address-card">
        <div class="route-dots">
          <div class="dot-green"></div>
          <div class="dot-line"></div>
          <div class="dot-red"></div>
        </div>
        <div class="inputs-wrap">
          <div>
            <input class="loc-field" id="pickupTxt" value="Hanamkonda, Telangana" />
          </div>
          <div>
            <input class="loc-field" id="dropTxt" value="Reddy Colony, Hanamkonda" />
          </div>
        </div>
        <div style="color: #64748b; font-size: 18px; cursor: pointer;">⇅</div>
      </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Screen 1: Ride Orb Layout (Default) -->
    <div id="orbSheet" class="sheet-card">
      <div class="orb-carousel">
        <div class="orb-item" id="tierCab" onclick="pickTier('Cab', 180, '14 min', this)">
          <div class="orb-circle">🚗</div>
          <div class="orb-label">CAB</div>
        </div>
        <div class="orb-item active" id="tierAuto" onclick="pickTier('Auto', 126, '12 min', this)">
          <div class="orb-circle">🛺</div>
          <div class="orb-label">AUTO</div>
        </div>
        <div class="orb-item" id="tierBike" onclick="pickTier('Bike', 58, '8 min', this)">
          <div class="orb-circle">🏍️</div>
          <div class="orb-label">BIKE</div>
        </div>
      </div>

      <div class="orb-eta" id="orbEta">12 min</div>
      <div class="fare-price" id="orbFare">₹126</div>
      <div class="fare-subtitle">Total Fare ⓘ</div>

      <button class="cta-btn-yellow" onclick="showPreviewScreen()">
        <span>Continue</span>
        <span>→</span>
      </button>

      <div class="action-grid">
        <div class="action-tile"><span>💵</span><div>Cash</div></div>
        <div class="action-tile"><span>⏱️</span><div>Offers</div></div>
        <div class="action-tile"><span>📋</span><div>Coupon</div></div>
        <div class="action-tile"><span>⋯</span><div>More</div></div>
      </div>
    </div>

    <!-- Screen 2: Trip Preview (Hidden until Continue is tapped) -->
    <div id="previewSheet" class="sheet-card" style="display:none;">
      
      <!-- Live Matched Driver Status / Safety PIN -->
      <div id="activeMatchAlert" class="status-overlay">
        <div style="font-size:11px; text-transform:uppercase; color:#22c55e; font-weight:700;">Driver Assigned</div>
        <div id="driverStatus" style="font-size:15px; font-weight:800; margin:4px 0;">Ramesh Rao (TS 03 EQ 4812)</div>
        <div style="font-size:12px; color:#94a3b8;">Share PIN: <b style="color:#facc15; font-size:16px;">1234</b></div>
        <button class="icon-circle-btn" style="margin: 8px auto 0; width:auto; border-radius:8px; padding:6px 14px; font-size:12px;" onclick="toggleVoipCall()">📞 Call Driver</button>
      </div>

      <!-- Distance & ETA Metric Strip -->
      <div class="metrics-bar">
        <div>
          <div class="metric-val" id="prevEta">12 min</div>
          <div class="metric-lbl">ETA</div>
        </div>
        <div style="border-left:1px solid rgba(255,255,255,0.08); border-right:1px solid rgba(255,255,255,0.08);">
          <div class="metric-val">7.2 km</div>
          <div class="metric-lbl">Distance</div>
        </div>
        <div>
          <div class="metric-val" id="prevFare">₹126</div>
          <div class="metric-lbl">Approx. Fare</div>
        </div>
      </div>

      <!-- Selected Vehicle Bar -->
      <div class="selected-ride-row">
        <div class="sel-left">
          <div class="sel-icon" id="prevIcon">🛺</div>
          <div>
            <div class="sel-title" id="prevTitle">Auto</div>
            <div class="sel-sub" id="prevSub">3 min away</div>
          </div>
        </div>
        <div class="sel-seats" id="prevSeats">👤 3</div>
      </div>

      <!-- Payment & Coupon Actions -->
      <div class="action-grid" style="margin-top:0; margin-bottom:14px; grid-template-columns: repeat(3, 1fr);">
        <div class="action-tile"><span>💵</span><div>Cash</div></div>
        <div class="action-tile"><span>%</span><div>Apply Coupon</div></div>
        <div class="action-tile"><span>✏️</span><div>Note to driver</div></div>
      </div>

      <!-- Booking CTA -->
      <button class="cta-btn-green" id="confirmBookBtn" onclick="dispatchRide()">
        <span>Confirm & Book</span>
        <span>→</span>
      </button>
    </div>

  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });

    let activeRideId = null, assignedDriverSocketId = null;
    let selectedVehicle = 'Auto';
    let selectedPrice = 126;
    let selectedEta = '12 min';
    let isCalling = false, peerConnection = null, localStream = null;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // Kazipet / Hanamkonda Corridor Coordinates
    const pickupCoords = [17.9784, 79.5218];
    const dropCoords = [18.0125, 79.5606];

    let map = null, carMarker = null;

    // Dark Map Layer
    window.addEventListener('DOMContentLoaded', () => {
      try {
        map = L.map('map', { zoomControl: false }).setView([17.9950, 79.5412], 13);
        
        // CartoDB Dark Matter tiles to match the exact dark UI
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          subdomains: 'abcd'
        }).addTo(map);

        // Custom start & end markers
        L.circleMarker(pickupCoords, { radius: 7, color: '#22c55e', fillColor: '#22c55e', fillOpacity: 1 }).addTo(map);
        L.circleMarker(dropCoords, { radius: 7, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 1 }).addTo(map);

        // Gold polyline connecting pickup to drop
        const routePath = [
          pickupCoords,
          [17.9850, 79.5300],
          [17.9940, 79.5420],
          [18.0050, 79.5510],
          dropCoords
        ];
        L.polyline(routePath, { color: '#facc15', weight: 4, opacity: 0.95 }).addTo(map);

        setTimeout(() => { if (map) map.invalidateSize(); }, 300);
      } catch (e) {
        console.error('Leaflet map initialization error:', e);
      }
    });

    // Orb Tier Selection
    function pickTier(tier, price, eta, element) {
      selectedVehicle = tier;
      selectedPrice = price;
      selectedEta = eta;

      document.querySelectorAll('.orb-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      document.getElementById('orbEta').innerText = eta;
      document.getElementById('orbFare').innerText = `₹${price}`;
    }

    // Toggle between Orb Layout (Screen 1) and Trip Preview (Screen 2)
    function showPreviewScreen() {
      document.getElementById('orbSheet').style.display = 'none';
      document.getElementById('previewSheet').style.display = 'flex';
      document.getElementById('pageTitle').style.display = 'block';

      document.getElementById('prevEta').innerText = selectedEta;
      document.getElementById('prevFare').innerText = `₹${selectedPrice}`;
      document.getElementById('prevTitle').innerText = selectedVehicle;

      if (selectedVehicle === 'Auto') {
        document.getElementById('prevIcon').innerText = '🛺';
        document.getElementById('prevSeats').innerText = '👤 3';
      } else if (selectedVehicle === 'Bike') {
        document.getElementById('prevIcon').innerText = '🏍️';
        document.getElementById('prevSeats').innerText = '👤 1';
      } else {
        document.getElementById('prevIcon').innerText = '🚗';
        document.getElementById('prevSeats').innerText = '👤 4';
      }

      if (map) map.invalidateSize();
    }

    function toggleScreen() {
      if (document.getElementById('previewSheet').style.display === 'flex') {
        document.getElementById('previewSheet').style.display = 'none';
        document.getElementById('orbSheet').style.display = 'flex';
        document.getElementById('pageTitle').style.display = 'none';
        if (map) map.invalidateSize();
      }
    }

    // Dispatch Ride to Driver Portal
    function dispatchRide() {
      activeRideId = 'ride_' + Date.now();
      const btn = document.getElementById('confirmBookBtn');
      btn.innerText = 'Finding Nearby Driver...';
      btn.style.background = '#eab308';

      socket.emit('ride:request', {
        rideId: activeRideId,
        pickup: pickupCoords,
        drop: dropCoords,
        vehicleType: selectedVehicle,
        fare: selectedPrice,
        selectedRouteName: 'Hanamkonda Main Road',
        distanceKm: 7.2
      });
    }

    // Driver Acceptance Event
    socket.on('ride:assigned', (data) => {
      assignedDriverSocketId = data.driverSocketId;
      document.getElementById('activeMatchAlert').style.display = 'block';
      document.getElementById('confirmBookBtn').style.display = 'none';
      document.getElementById('driverStatus').innerText = `${data.name || 'Ramesh Rao'} (${data.vehiclePlate || 'TS 03 EQ 4812'})`;
    });

    // Telemetry vehicle movement on map
    socket.on('ride:telemetry_update', (data) => {
      if (data.rideId === activeRideId) {
        if (!carMarker && map) {
          carMarker = L.circleMarker([data.lat, data.lng], { radius: 9, color: '#ffffff', fillColor: '#38bdf8', fillOpacity: 1 }).addTo(map);
        } else if (carMarker) {
          carMarker.setLatLng([data.lat, data.lng]);
        }
      }
    });

    // Ride Completed
    socket.on('ride:completed_client', () => {
      alert('Ride completed! Thank you for choosing Velox.');
      location.reload();
    });

    // VoIP WebRTC Voice Calling
    async function toggleVoipCall() { isCalling ? endCall() : await startCall(); }

    async function startCall() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        peerConnection.ontrack = e => document.getElementById('remoteAudio').srcObject = e.streams[0];
        peerConnection.onicecandidate = e => {
          if (e.candidate && assignedDriverSocketId) {
            socket.emit('call:ice_candidate', { targetSocketId: assignedDriverSocketId, candidate: e.candidate });
          }
        };
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('call:initiate', { targetSocketId: assignedDriverSocketId, offer });
        isCalling = true;
      } catch (err) {
        alert('Microphone permission required for VoIP calls.');
      }
    }

    socket.on('call:accepted', async ({ answer }) => {
      if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on('call:incoming', async ({ fromSocketId, offer }) => {
      assignedDriverSocketId = fromSocketId;
      if (confirm('Incoming call from Driver. Accept?')) {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        peerConnection.ontrack = e => document.getElementById('remoteAudio').srcObject = e.streams[0];
        peerConnection.onicecandidate = e => {
          if (e.candidate) socket.emit('call:ice_candidate', { targetSocketId: fromSocketId, candidate: e.candidate });
        };
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('call:accept', { targetSocketId: fromSocketId, answer });
        isCalling = true;
      }
    });

    socket.on('call:ice_candidate', async ({ candidate }) => {
      if (peerConnection && candidate) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    });

    socket.on('call:ended', () => endCall(false));

    function endCall(notify = true) {
      if (notify && assignedDriverSocketId) socket.emit('call:end', { targetSocketId: assignedDriverSocketId });
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      isCalling = false;
    }
  </script>
</body>
</html>
