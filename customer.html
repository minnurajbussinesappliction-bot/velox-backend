<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Velox Ride</title>

  <!-- Leaflet & Socket.io CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100vh; background: #000000; color: #ffffff; display: flex; justify-content: center; }

    .app-screen {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #090c10;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      border: 1px solid #161b22;
    }

    /* Top Floating Navigation Header */
    .top-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .back-btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .icon-circle-btn {
      width: 38px;
      height: 38px;
      background: rgba(18, 23, 31, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
    }
    .header-title { font-size: 16px; font-weight: 700; color: #ffffff; }

    /* Address Input Card */
    .address-card {
      background: rgba(18, 23, 31, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .route-dots { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .dot-green { width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid #22c55e; background: transparent; }
    .dot-line { width: 1.5px; height: 18px; border-left: 1.5px dashed #475569; }
    .dot-red { width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid #ef4444; background: transparent; }
    .inputs-wrap { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .loc-field { font-size: 13px; font-weight: 600; color: #f8fafc; background: transparent; border: none; outline: none; width: 100%; }

    /* Dark Map Viewport */
    #map { width: 100%; height: 50vh; min-height: 300px; background: #0b0f17; z-index: 1; }

    /* Bottom Sheet */
    .sheet-card {
      flex: 1;
      background: #0e131b;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      margin-top: -24px;
      z-index: 500;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 18px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 -12px 30px rgba(0,0,0,0.7);
    }

    /* Screen 1: Ride Orb Carousel */
    .orb-carousel {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
    }
    .orb-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      opacity: 0.5;
      transform: scale(0.88);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .orb-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #161e2b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .orb-label { font-size: 11px; font-weight: 800; color: #94a3b8; margin-top: 6px; text-transform: uppercase; }
    
    .orb-item.active { opacity: 1; transform: scale(1.08); }
    .orb-item.active .orb-circle {
      width: 86px;
      height: 86px;
      background: radial-gradient(circle, #252312 20%, #151a24 90%);
      border: 2px solid #facc15;
      box-shadow: 0 0 28px rgba(250, 204, 21, 0.45);
    }
    .orb-item.active .orb-label { color: #ffffff; }
    .orb-eta { font-size: 12px; color: #facc15; font-weight: 700; margin-top: 10px; }

    .fare-price { font-size: 36px; font-weight: 900; color: #ffffff; margin-top: 8px; }
    .fare-subtitle { font-size: 12px; color: #94a3b8; margin-top: 2px; margin-bottom: 14px; }

    .cta-btn-yellow {
      width: 100%;
      background: #facc15;
      color: #000000;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .cta-btn-green {
      width: 100%;
      background: #4ade80;
      color: #04220e;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Screen 2: Metrics Bar */
    .metrics-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: #141c28;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 0;
      margin-bottom: 14px;
      text-align: center;
    }
    .metric-val { font-size: 16px; font-weight: 800; color: #fff; }
    .metric-lbl { font-size: 11px; color: #64748b; margin-top: 2px; }

    .selected-ride-row {
      width: 100%;
      background: #141c28;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .sel-left { display: flex; align-items: center; gap: 12px; }
    .sel-icon { font-size: 28px; }
    .sel-title { font-size: 15px; font-weight: 700; color: #fff; }
    .sel-sub { font-size: 11px; color: #64748b; }
    .sel-seats { background: #1c2636; padding: 4px 8px; border-radius: 8px; font-size: 12px; color: #94a3b8; font-weight: 700; }

    /* ACTION BAR WITH PAYMENT DROPDOWN & BRAND / NOTE TO DRIVER */
    .custom-action-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .select-dropdown-tile {
      background: #141c28;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
    }
    .brand-note-tile {
      background: #141c28;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .brand-pill {
      background: #facc15;
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Hidden Dropdown Options Menu */
    .payment-dropdown-menu {
      position: absolute;
      bottom: 50px;
      left: 0;
      right: 0;
      background: #1c2636;
      border: 1px solid #334155;
      border-radius: 12px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
    }
    .pay-option {
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pay-option:hover { background: #22c55e; color: #04220e; }

    /* Note Modal */
    .note-modal {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #141c28;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 18px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 3000;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <!-- Top Header Overlay -->
    <div class="top-header">
      <div class="back-btn-row">
        <div class="icon-circle-btn" onclick="toggleScreen()">←</div>
        <div class="header-title" id="pageTitle" style="display:none;">Trip Preview</div>
        <div class="icon-circle-btn">⋯</div>
      </div>

      <!-- Address Input Box -->
      <div class="address-card">
        <div class="route-dots">
          <div class="dot-green"></div>
          <div class="dot-line"></div>
          <div class="dot-red"></div>
        </div>
        <div class="inputs-wrap">
          <div><input class="loc-field" id="pickupTxt" value="Hanamkonda, Telangana" /></div>
          <div><input class="loc-field" id="dropTxt" value="Reddy Colony, Hanamkonda" /></div>
        </div>
        <div style="color: #64748b; font-size: 18px; cursor: pointer;">⇅</div>
      </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Screen 1: Ride Orb Layout -->
    <div id="orbSheet" class="sheet-card">
      <div class="orb-carousel">
        <div class="orb-item" onclick="pickTier('Cab', 180, '14 min', this)">
          <div class="orb-circle">🚗</div>
          <div class="orb-label">CAB</div>
        </div>
        <div class="orb-item active" onclick="pickTier('Auto', 126, '12 min', this)">
          <div class="orb-circle">🛺</div>
          <div class="orb-label">AUTO</div>
        </div>
        <div class="orb-item" onclick="pickTier('Bike', 58, '8 min', this)">
          <div class="orb-circle">🏍️</div>
          <div class="orb-label">BIKE</div>
        </div>
      </div>

      <div class="orb-eta" id="orbEta">12 min</div>
      <div class="fare-price" id="orbFare">₹126</div>
      <div class="fare-subtitle">Total Fare ⓘ</div>

      <button class="cta-btn-yellow" onclick="showPreviewScreen()">
        <span>Continue</span>
        <span>→</span>
      </button>
    </div>

    <!-- Screen 2: Trip Preview -->
    <div id="previewSheet" class="sheet-card" style="display:none;">
      
      <!-- Metrics Strip -->
      <div class="metrics-bar">
        <div>
          <div class="metric-val" id="prevEta">12 min</div>
          <div class="metric-lbl">ETA</div>
        </div>
        <div style="border-left:1px solid rgba(255,255,255,0.08); border-right:1px solid rgba(255,255,255,0.08);">
          <div class="metric-val">7.2 km</div>
          <div class="metric-lbl">Distance</div>
        </div>
        <div>
          <div class="metric-val" id="prevFare">₹126</div>
          <div class="metric-lbl">Approx. Fare</div>
        </div>
      </div>

      <!-- Selected Vehicle Row -->
      <div class="selected-ride-row">
        <div class="sel-left">
          <div class="sel-icon" id="prevIcon">🛺</div>
          <div>
            <div class="sel-title" id="prevTitle">Auto</div>
            <div class="sel-sub">3 min away</div>
          </div>
        </div>
        <div class="sel-seats">👤 3</div>
      </div>

      <!-- PAYMENT DROPDOWN & BRAND + NOTE TO DRIVER -->
      <div class="custom-action-row">
        <!-- 1. Drop Button at Cash to Select Mode -->
        <div class="select-dropdown-tile" onclick="togglePaymentMenu()">
          <div style="display:flex; align-items:center; gap:8px;">
            <span id="currentPayIcon">💵</span>
            <span style="font-size:12px; font-weight:700;" id="currentPayLabel">Cash</span>
          </div>
          <span style="font-size:12px; color:#64748b;">▼</span>

          <div class="payment-dropdown-menu" id="paymentDropdown">
            <div class="pay-option" onclick="choosePayment('💵', 'Cash')">💵 Cash</div>
            <div class="pay-option" onclick="choosePayment('📱', 'UPI / GPay')">📱 UPI / GPay</div>
            <div class="pay-option" onclick="choosePayment('👛', 'Velox Wallet')">👛 Velox Wallet</div>
          </div>
        </div>

        <!-- 2. Brand Name & Note to Driver -->
        <div class="brand-note-tile" onclick="openNoteModal()">
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="brand-pill">VELOX</span>
            <span style="font-size:11px; font-weight:700;">Note to driver</span>
          </div>
          <span>✏️</span>
        </div>
      </div>

      <!-- Confirm Booking Button -->
      <button class="cta-btn-green" id="confirmBookBtn" onclick="dispatchRide()">
        <span>Confirm & Book</span>
        <span>→</span>
      </button>

      <!-- Assigned Driver Status -->
      <div id="activeMatchAlert" style="display:none; width:100%; margin-top:10px; background:#141c28; border:1px solid #22c55e; border-radius:12px; padding:10px; text-align:center;">
        <div style="font-size:11px; color:#22c55e; font-weight:800;">DRIVER EN ROUTE</div>
        <div style="font-size:14px; font-weight:800; margin:3px 0;">Ramesh Rao (TS 03 EQ 4812)</div>
        <div style="font-size:12px;">Share PIN: <b style="color:#facc15; font-size:15px;">1234</b></div>
      </div>
    </div>

  </div>

  <!-- Note to Driver Modal -->
  <div class="note-modal" id="noteModal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:13px; font-weight:800;">Send Note / Pickup Instruction</span>
      <span style="cursor:pointer; color:#94a3b8;" onclick="closeNoteModal()">✕</span>
    </div>
    <input id="noteInput" style="width:100%; padding:12px; background:#090c10; border:1px solid #334155; border-radius:10px; color:#fff; font-size:14px; outline:none;" placeholder="E.g. Waiting near main gate, yellow bag..." />
    <button class="cta-btn-green" style="padding:12px;" onclick="sendNote()">Send to Driver</button>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
    let activeRideId = null, assignedDriverSocketId = null;
    let selectedVehicle = 'Auto', selectedPrice = 126, selectedEta = '12 min';

    const pickupCoords = [17.9784, 79.5218];
    const dropCoords = [18.0125, 79.5606];
    let map = null;

    window.addEventListener('DOMContentLoaded', () => {
      try {
        map = L.map('map', { zoomControl: false }).setView([17.9950, 79.5412], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        L.circleMarker(pickupCoords, { radius: 7, color: '#22c55e', fillColor: '#22c55e', fillOpacity: 1 }).addTo(map);
        L.circleMarker(dropCoords, { radius: 7, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 1 }).addTo(map);
        
        const route = [pickupCoords, [17.9850, 79.5300], [17.9940, 79.5420], [18.0050, 79.5510], dropCoords];
        L.polyline(route, { color: '#facc15', weight: 4 }).addTo(map);
        setTimeout(() => { if (map) map.invalidateSize(); }, 300);
      } catch (e) { console.error('Map init error:', e); }
    });

    function pickTier(tier, price, eta, element) {
      selectedVehicle = tier; selectedPrice = price; selectedEta = eta;
      document.querySelectorAll('.orb-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('orbEta').innerText = eta;
      document.getElementById('orbFare').innerText = `₹${price}`;
    }

    function showPreviewScreen() {
      document.getElementById('orbSheet').style.display = 'none';
      document.getElementById('previewSheet').style.display = 'flex';
      document.getElementById('pageTitle').style.display = 'block';
      document.getElementById('prevEta').innerText = selectedEta;
      document.getElementById('prevFare').innerText = `₹${selectedPrice}`;
      document.getElementById('prevTitle').innerText = selectedVehicle;
      document.getElementById('prevIcon').innerText = selectedVehicle === 'Auto' ? '🛺' : selectedVehicle === 'Bike' ? '🏍️' : '🚗';
      if (map) map.invalidateSize();
    }

    function toggleScreen() {
      if (document.getElementById('previewSheet').style.display === 'flex') {
        document.getElementById('previewSheet').style.display = 'none';
        document.getElementById('orbSheet').style.display = 'flex';
        document.getElementById('pageTitle').style.display = 'none';
        if (map) map.invalidateSize();
      }
    }

    // Payment Dropdown Logic
    function togglePaymentMenu() {
      const menu = document.getElementById('paymentDropdown');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function choosePayment(icon, label) {
      document.getElementById('currentPayIcon').innerText = icon;
      document.getElementById('currentPayLabel').innerText = label;
      document.getElementById('paymentDropdown').style.display = 'none';
    }

    // Note to Driver Logic
    function openNoteModal() { document.getElementById('noteModal').style.display = 'flex'; }
    function closeNoteModal() { document.getElementById('noteModal').style.display = 'none'; }

    function sendNote() {
      const note = document.getElementById('noteInput').value;
      if (!note) return;
      socket.emit('msg:to_driver', { rideId: activeRideId, message: note });
      alert('Note delivered to your driver!');
      closeNoteModal();
    }

    socket.on('msg:received_customer', ({ message }) => {
      alert(`Driver sent you a message: ${message}`);
    });

    // Booking Dispatch
    function dispatchRide() {
      activeRideId = 'ride_' + Date.now();
      document.getElementById('confirmBookBtn').innerText = 'Finding Nearby Driver...';
      document.getElementById('confirmBookBtn').style.background = '#eab308';

      socket.emit('ride:request', {
        rideId: activeRideId,
        pickup: pickupCoords,
        drop: dropCoords,
        vehicleType: selectedVehicle,
        fare: selectedPrice,
        selectedRouteName: 'Hanamkonda Main Road',
        distanceKm: 7.2
      });
    }

    socket.on('ride:assigned', (data) => {
      assignedDriverSocketId = data.driverSocketId;
      document.getElementById('confirmBookBtn').style.display = 'none';
      document.getElementById('activeMatchAlert').style.display = 'block';
    });
  </script>
</body>
</html>
